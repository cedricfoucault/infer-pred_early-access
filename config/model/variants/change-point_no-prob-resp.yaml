# In the paper, this corresponds to the change-point model variant without the
# response-probability mechanism
name: Change-point model (no prob. resp.)
id: null # will be replaced by the name of this file
type: bayes
inference:
  state_space:
    hmean: "true"
    hsd:
      type: discrete
      values: [10, 30]
  dynamics:
    hmean:
      type: change_point
      p_cp: 0.0625 # 1/16
      min_change_amount: 1 # this encodes the assumption that the hidden state
                           # value does not stay the same when a change point occurs
    hsd:
      type: change_point
      p_cp: 0.0625 # 1/16
      min_change_amount: 1 # this encodes the assumption that the hidden state
                           # value does not stay the same when a change point occurs
bet_fun: max_reward